name: Example – upload and download artifact via S3

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Maak een voorbeeld artifact
      - name: Build artifact
        run: |
          mkdir -p dist
          echo "Hello from build ${{ github.run_id }}" > dist/output.txt

      # Zet AWS credentials (Scaleway, AWS, MinIO, R2, …)
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.SCW_ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.SCW_SECRET_KEY }}
          aws-region: nl-ams

      # Upload naar S3
      - uses: ./.github/actions/s3-upload-artifact
        with:
          name: my-build
          path: dist/
          bucket: ${{ secrets.SCW_BUCKET_NAME }}
          endpoint-url: https://s3.nl-ams.scw.cloud

  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      # Zet AWS credentials
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.SCW_ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.SCW_SECRET_KEY }}
          aws-region: nl-ams

      # Download van S3
      - uses: xprtz/s3-artifacts/.github/actions/s3-download-artifact@main
        with:
          name: my-build
          path: downloaded/
          bucket: ${{ secrets.SCW_BUCKET_NAME }}
          endpoint-url: https://s3.nl-ams.scw.cloud

      - name: Gebruik artifact
        run: cat downloaded/my-build/dist/output.txt
